# This must exactly match one profile name. Display names can also be changed
# in this advanced config file.
default = "Qwen"

# Each entry is one actual model runtime, not one quantization preset. Keep the
# service names model-agnostic; its ExecStart points at the downloaded GGUF file
# and owns that model's context, cache, GPU, and optional draft-model settings.
[[profiles]]
name = "Qwen"
service = "omarchy-local-ai-runtime-1.service"
# summary = "Optional human-readable description"
# endpoint = "http://127.0.0.1:8080/v1"

[[profiles]]
name = "Gemma"
service = "omarchy-local-ai-runtime-2.service"

[[profiles]]
name = "Vision"
service = "omarchy-local-ai-runtime-3.service"
